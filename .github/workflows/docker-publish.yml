name: Auto Build & Push FRP

on:
  schedule:
    # 每天检查一次（UTC 19:15，即北京时间 03:15，避开整点高峰）
    - cron: '15 19 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号（例如 v0.68.1，留空则自动获取上游最新版）'
        required: false
        default: ''
      force:
        description: '即使私有仓库已存在该版本也强制重新构建'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: jalena
  CNB_REGISTRY: docker.cnb.cool
  CNB_NAMESPACE: youvigo/base

jobs:
  check:
    name: Check Upstream Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
      should_build: ${{ steps.resolve.outputs.should_build }}

    steps:
      - name: Login CNB Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CNB_REGISTRY }}
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Resolve version & check registry
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 获取上游最新正式版本（自动排除 draft / prerelease）
          UPSTREAM_LATEST=$(gh api repos/fatedier/frp/releases/latest --jq '.tag_name')
          echo "Upstream latest release: ${UPSTREAM_LATEST}"

          INPUT_VER="${{ inputs.version }}"
          if [ -n "${INPUT_VER}" ]; then
            TARGET_VER="${INPUT_VER}"
          else
            TARGET_VER="${UPSTREAM_LATEST}"
          fi

          # 判断本次构建的版本是否等于上游最新版，避免手动补建旧版本时误覆盖 latest 标签
          if [ "${TARGET_VER}" = "${UPSTREAM_LATEST}" ]; then
            IS_LATEST="true"
          else
            IS_LATEST="false"
          fi

          # 直接检查私有仓库是否已存在 frpc 与 frps 对应版本镜像
          if [ "${{ inputs.force }}" != "true" ] && \
             docker manifest inspect "${CNB_REGISTRY}/${CNB_NAMESPACE}/frpc:${TARGET_VER}" >/dev/null 2>&1 && \
             docker manifest inspect "${CNB_REGISTRY}/${CNB_NAMESPACE}/frps:${TARGET_VER}" >/dev/null 2>&1; then
            echo "Images for ${TARGET_VER} already exist in ${CNB_REGISTRY}/${CNB_NAMESPACE}, skipping build."
            SHOULD_BUILD="false"
          else
            echo "Need to build version: ${TARGET_VER} (is_latest=${IS_LATEST})"
            SHOULD_BUILD="true"
          fi

          echo "version=${TARGET_VER}" >> "$GITHUB_OUTPUT"
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push (${{ matrix.app }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [frpc, frps]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login CNB Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CNB_REGISTRY }}
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Generate image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.app }}
            ${{ env.CNB_REGISTRY }}/${{ env.CNB_NAMESPACE }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest,enable=${{ needs.check.outputs.is_latest == 'true' }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          build-args: |
            FRP_VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
