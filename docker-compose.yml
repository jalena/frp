services:
  frpc:
    image: docker.cnb.cool/youvigo/base/frpc:latest
    container_name: frpc
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./conf.d/frpc.toml:/etc/frp/frpc.toml:ro
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 100M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
